name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: Run ruff check
        run: ruff check newsfeed/ tests/

  test:
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      # test_dedup.py は Testcontainers が Valkey を起動する (runner の Docker を使用)
      - name: Run tests
        run: pytest tests/ -v --junitxml=pytest-report.xml
      - name: Report test results
        if: ${{ !cancelled() }}
        uses: kenyamaneko/overload-party-common/.github/actions/python-test-report@main
        with:
          xml-path: pytest-report.xml
          title: テスト結果

name: CI

# PR の品質ゲート。main への push では test-catalog.yaml から呼ばれ、
# テスト観点カタログの元になる。
on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      code-changed:
        description: "'true' when the run touched code. The test results exist only then."
        value: ${{ jobs.changes.outputs.code }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # main の run は GitHub Pages への deploy に繋がるため、後続の push で打ち切らない
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect code change
        id: detect
        uses: kenyamaneko/overload-party-common/.github/actions/detect-code-change@main

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: Run ruff check
        run: ruff check newsfeed/ tests/

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      # test_dedup.py は Testcontainers が Valkey を起動する (runner の Docker を使用)
      - name: Run tests
        run: pytest tests/ -v --junitxml=pytest-report.xml
      - name: Report test results
        if: ${{ !cancelled() }}
        uses: kenyamaneko/overload-party-common/.github/actions/python-test-report@main
        with:
          xml-path: pytest-report.xml
          title: テスト結果
      # 同一 run 内でテスト観点カタログを組むためだけに使うので保持は最短にする
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          retention-days: 1
